<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="520" fill="#f8f9fa" rx="12"/>
  
  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Agentic AI Cookbook — 56 Lessons</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#666">From your first LLM call to production-ready multi-agent swarms</text>

  <!-- Phase 1: Fundamentals -->
  <rect x="30" y="85" width="170" height="380" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="115" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">🐣 Fundamentals</text>
  <text x="115" y="128" text-anchor="middle" font-size="11" fill="#1565C0">Lessons 00–07</text>
  
  <rect x="45" y="145" width="140" height="30" rx="15" fill="#1565C0"/><text x="115" y="165" text-anchor="middle" font-size="12" fill="#fff">00 Setup</text>
  <rect x="45" y="183" width="140" height="30" rx="15" fill="#1976D2"/><text x="115" y="203" text-anchor="middle" font-size="12" fill="#fff">01 Hello LLM</text>
  <rect x="45" y="221" width="140" height="30" rx="15" fill="#1E88E5"/><text x="115" y="241" text-anchor="middle" font-size="12" fill="#fff">02–04 Prompts &amp; Parsers</text>
  <rect x="45" y="259" width="140" height="30" rx="15" fill="#2196F3"/><text x="115" y="279" text-anchor="middle" font-size="12" fill="#fff">05–07 Chains &amp; Chat</text>
  
  <text x="50" y="320" font-size="10" fill="#1565C0">▸ LLM calls</text>
  <text x="50" y="336" font-size="10" fill="#1565C0">▸ Prompt templates</text>
  <text x="50" y="352" font-size="10" fill="#1565C0">▸ Output parsers</text>
  <text x="50" y="368" font-size="10" fill="#1565C0">▸ Multi-turn chat</text>
  <text x="50" y="384" font-size="10" fill="#1565C0">▸ LCEL basics</text>

  <!-- Arrow 1→2 -->
  <path d="M205 275 L235 275" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Chains & LCEL -->
  <rect x="240" y="85" width="160" height="380" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="320" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">🔗 Chains &amp; LCEL</text>
  <text x="320" y="128" text-anchor="middle" font-size="11" fill="#2E7D32">Lessons 08–12</text>

  <rect x="255" y="145" width="130" height="28" rx="14" fill="#2E7D32"/><text x="320" y="164" text-anchor="middle" font-size="11" fill="#fff">08 Pipe Operator</text>
  <rect x="255" y="181" width="130" height="28" rx="14" fill="#388E3C"/><text x="320" y="200" text-anchor="middle" font-size="11" fill="#fff">09–10 Runnable</text>
  <rect x="255" y="217" width="130" height="28" rx="14" fill="#43A047"/><text x="320" y="236" text-anchor="middle" font-size="11" fill="#fff">11–12 Branch &amp; Batch</text>
  <rect x="255" y="259" width="130" height="28" rx="14" fill="#4CAF50"/><text x="320" y="278" text-anchor="middle" font-size="11" fill="#fff">13 LCEL Deep Dive</text>
  
  <text x="250" y="320" font-size="10" fill="#2E7D32">▸ RunnableParallel</text>
  <text x="250" y="336" font-size="10" fill="#2E7D32">▸ RunnablePassthrough</text>
  <text x="250" y="352" font-size="10" fill="#2E7D32">▸ RunnableBranch</text>
  <text x="250" y="368" font-size="10" fill="#2E7D32">▸ Fallbacks &amp; Retry</text>
  <text x="250" y="384" font-size="10" fill="#2E7D32">▸ Configurable</text>

  <!-- Arrow 2→3 -->
  <path d="M405 275 L435 275" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 3: Memory & RAG -->
  <rect x="440" y="85" width="170" height="380" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="525" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#E65100">🧠 Memory &amp; RAG</text>
  <text x="525" y="128" text-anchor="middle" font-size="11" fill="#E65100">Lessons 14–20</text>

  <rect x="455" y="145" width="140" height="28" rx="14" fill="#E65100"/><text x="525" y="164" text-anchor="middle" font-size="11" fill="#fff">14–15 Memory</text>
  <rect x="455" y="181" width="140" height="28" rx="14" fill="#EF6C00"/><text x="525" y="200" text-anchor="middle" font-size="11" fill="#fff">16–17 Loaders &amp; Split</text>
  <rect x="455" y="217" width="140" height="28" rx="14" fill="#F57C00"/><text x="525" y="236" text-anchor="middle" font-size="11" fill="#fff">18 Vector Stores</text>
  <rect x="455" y="253" width="140" height="28" rx="14" fill="#FB8C00"/><text x="525" y="272" text-anchor="middle" font-size="11" fill="#fff">19–20 RAG + Tools</text>

  <text x="450" y="320" font-size="10" fill="#E65100">▸ ChatMessageHistory</text>
  <text x="450" y="336" font-size="10" fill="#E65100">▸ Document loaders</text>
  <text x="450" y="352" font-size="10" fill="#E65100">▸ Text splitters</text>
  <text x="450" y="368" font-size="10" fill="#E65100">▸ Vector stores</text>
  <text x="450" y="384" font-size="10" fill="#E65100">▸ RAG pipeline</text>

  <!-- Arrow 3→4 -->
  <path d="M615 275 L645 275" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: LangGraph -->
  <rect x="650" y="85" width="160" height="380" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="730" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">🔄 LangGraph</text>
  <text x="730" y="128" text-anchor="middle" font-size="11" fill="#7B1FA2">Lessons 21–35</text>

  <rect x="665" y="145" width="130" height="28" rx="14" fill="#7B1FA2"/><text x="730" y="164" text-anchor="middle" font-size="11" fill="#fff">21 Overview</text>
  <rect x="665" y="181" width="130" height="28" rx="14" fill="#8E24AA"/><text x="730" y="200" text-anchor="middle" font-size="11" fill="#fff">22 Structured Output</text>
  <rect x="665" y="217" width="130" height="28" rx="14" fill="#9C27B0"/><text x="730" y="236" text-anchor="middle" font-size="11" fill="#fff">23–35 Deep Dive</text>
  <rect x="665" y="259" width="130" height="28" rx="14" fill="#AB47BC"/><text x="730" y="278" text-anchor="middle" font-size="11" fill="#fff">13 Concepts</text>

  <text x="660" y="320" font-size="10" fill="#7B1FA2">▸ StateGraph</text>
  <text x="660" y="336" font-size="10" fill="#7B1FA2">▸ ToolNode</text>
  <text x="660" y="352" font-size="10" fill="#7B1FA2">▸ Checkpointing</text>
  <text x="660" y="368" font-size="10" fill="#7B1FA2">▸ Human-in-Loop</text>
  <text x="660" y="384" font-size="10" fill="#7B1FA2">▸ Send API</text>

  <!-- Arrow 4→5 -->
  <path d="M815 275 L845 275" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 5: Projects -->
  <rect x="850" y="85" width="140" height="380" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
  <text x="920" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">🏗️ Projects</text>
  <text x="920" y="128" text-anchor="middle" font-size="11" fill="#C62828">Lessons 36–56</text>

  <rect x="860" y="145" width="120" height="28" rx="14" fill="#C62828"/><text x="920" y="164" text-anchor="middle" font-size="10" fill="#fff">36–39 Multi-Agent</text>
  <rect x="860" y="181" width="120" height="28" rx="14" fill="#D32F2F"/><text x="920" y="200" text-anchor="middle" font-size="10" fill="#fff">40–43 Swarms</text>
  <rect x="860" y="217" width="120" height="28" rx="14" fill="#E53935"/><text x="920" y="236" text-anchor="middle" font-size="10" fill="#fff">44–46 RAG Systems</text>
  <rect x="860" y="253" width="120" height="28" rx="14" fill="#EF5350"/><text x="920" y="272" text-anchor="middle" font-size="10" fill="#fff">47–50 Production</text>
  <rect x="860" y="289" width="120" height="28" rx="14" fill="#E57373"/><text x="920" y="308" text-anchor="middle" font-size="10" fill="#fff">51–56 Advanced</text>

  <text x="860" y="340" font-size="10" fill="#C62828">▸ Supervisor/Worker</text>
  <text x="860" y="356" font-size="10" fill="#C62828">▸ Agent swarms</text>
  <text x="860" y="372" font-size="10" fill="#C62828">▸ Production RAG</text>
  <text x="860" y="388" font-size="10" fill="#C62828">▸ FastAPI server</text>
  <text x="860" y="404" font-size="10" fill="#C62828">▸ Advanced RAG</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#999"/>
    </marker>
  </defs>
</svg>