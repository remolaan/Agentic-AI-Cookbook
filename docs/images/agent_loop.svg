<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" font-family="system-ui, sans-serif">
  <rect width="600" height="450" fill="#f8f9fa" rx="12"/>
  <text x="300" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#7B1FA2">LangGraph Agent Loop — ReAct Pattern</text>

  <!-- Question -->
  <rect x="200" y="55" width="200" height="40" rx="20" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#E65100">❓ User Question</text>

  <!-- Arrow down -->
  <path d="M300 95 L300 125" stroke="#666" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Agent LLM -->
  <rect x="175" y="130" width="250" height="55" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">🤖 Agent LLM</text>
  <text x="300" y="173" text-anchor="middle" font-size="11" fill="#666">Decides: answer or call tool?</text>

  <!-- Diamond: tool call? -->
  <path d="M300 185 L370 230 L300 275 L230 230 Z" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="300" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">Tool</text>
  <text x="300" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">needed?</text>

  <!-- Yes path -->
  <path d="M370 230 L430 230 L430 340 L370 340" stroke="#C62828" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="400" y="220" text-anchor="middle" font-size="11" fill="#C62828" font-weight="bold">Yes</text>

  <!-- Tool Node -->
  <rect x="175" y="310" width="250" height="55" rx="10" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
  <text x="300" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">🛠️ ToolNode</text>
  <text x="300" y="353" text-anchor="middle" font-size="11" fill="#666">Runs tool, returns result</text>

  <!-- Loop back arrow -->
  <path d="M175 337 L100 337 L100 150 L175 150" stroke="#C62828" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3"/>
  <text x="80" y="260" text-anchor="middle" font-size="10" fill="#C62828">loop</text>

  <!-- No path -->
  <path d="M230 230 L80 230 L80 380 L175 380" stroke="#2E7D32" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#2E7D32" font-weight="bold">No</text>

  <!-- Final Answer -->
  <rect x="200" y="365" width="200" height="40" rx="20" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="300" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">✅ Final Answer</text>

  <!-- Interrupt path -->
  <path d="M300 185 L300 185" stroke="none"/>
  <rect x="40" y="60" width="140" height="30" rx="8" fill="#FFF" stroke="#999" stroke-width="1"/>
  <text x="110" y="80" text-anchor="middle" font-size="10" fill="#666">⏸️ Human-in-Loop</text>
  <path d="M110 90 L110 130" stroke="#999" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="110" y="245" text-anchor="middle" font-size="9" fill="#999">optional approval</text>
  <path d="M110 260 L230 260" stroke="#999" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>
</svg>