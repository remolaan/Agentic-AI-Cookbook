<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="system-ui, sans-serif">
  <rect width="900" height="380" fill="#f8f9fa" rx="12"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Learning Journey Timeline</text>

  <!-- Horizontal line -->
  <line x1="60" y1="130" x2="860" y2="130" stroke="#ccc" stroke-width="3"/>
  <line x1="60" y1="280" x2="860" y2="280" stroke="#ccc" stroke-width="3"/>

  <!-- Phase circles and labels -->
  <!-- Phase 1 -->
  <circle cx="120" cy="130" r="35" fill="#E3F2FD" stroke="#1565C0" stroke-width="3"/>
  <text x="120" y="126" text-anchor="middle" font-size="18">🐣</text>
  <text x="120" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565C0">00–07</text>
  <text x="120" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565C0">Fundamentals</text>
  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#666">LLM basics</text>

  <path d="M120 165 L120 195" stroke="#1565C0" stroke-width="2"/>
  <rect x="70" y="195" width="100" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="120" y="215" text-anchor="middle" font-size="10" fill="#1565C0">▸ First LLM call</text>
  <text x="120" y="232" text-anchor="middle" font-size="10" fill="#1565C0">▸ Prompt templates</text>
  <text x="120" y="249" text-anchor="middle" font-size="10" fill="#1565C0">▸ Output parsers</text>

  <!-- Arrow -->
  <path d="M155 130 L185 130" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 2 -->
  <circle cx="220" cy="130" r="35" fill="#E8F5E9" stroke="#2E7D32" stroke-width="3"/>
  <text x="220" y="126" text-anchor="middle" font-size="18">🔗</text>
  <text x="220" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">08–12</text>
  <text x="220" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Chains &amp; LCEL</text>
  <text x="220" y="100" text-anchor="middle" font-size="10" fill="#666">Runnable API</text>

  <path d="M220 165 L220 195" stroke="#2E7D32" stroke-width="2"/>
  <rect x="170" y="195" width="100" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="220" y="215" text-anchor="middle" font-size="10" fill="#2E7D32">▸ Pipe operator</text>
  <text x="220" y="232" text-anchor="middle" font-size="10" fill="#2E7D32">▸ RunnableParallel</text>
  <text x="220" y="249" text-anchor="middle" font-size="10" fill="#2E7D32">▸ RunnableBranch</text>

  <path d="M255 130 L285 130" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 3 -->
  <circle cx="320" cy="130" r="35" fill="#FFF3E0" stroke="#E65100" stroke-width="3"/>
  <text x="320" y="126" text-anchor="middle" font-size="18">🧠</text>
  <text x="320" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#E65100">13–20</text>
  <text x="320" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#E65100">Memory &amp; RAG</text>
  <text x="320" y="100" text-anchor="middle" font-size="10" fill="#666">Retrieval</text>

  <path d="M320 165 L320 195" stroke="#E65100" stroke-width="2"/>
  <rect x="270" y="195" width="100" height="70" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <text x="320" y="215" text-anchor="middle" font-size="10" fill="#E65100">▸ Chat history</text>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#E65100">▸ Vector stores</text>
  <text x="320" y="249" text-anchor="middle" font-size="10" fill="#E65100">▸ RAG pipeline</text>

  <path d="M355 130 L385 130" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 4 -->
  <circle cx="420" cy="130" r="35" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="3"/>
  <text x="420" y="126" text-anchor="middle" font-size="18">🔄</text>
  <text x="420" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">21–35</text>
  <text x="420" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#7B1FA2">LangGraph</text>
  <text x="420" y="100" text-anchor="middle" font-size="10" fill="#666">State graphs</text>

  <path d="M420 165 L420 195" stroke="#7B1FA2" stroke-width="2"/>
  <rect x="370" y="195" width="100" height="70" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1.5"/>
  <text x="420" y="215" text-anchor="middle" font-size="10" fill="#7B1FA2">▸ StateGraph</text>
  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#7B1FA2">▸ ToolNode</text>
  <text x="420" y="249" text-anchor="middle" font-size="10" fill="#7B1FA2">▸ Checkpointing</text>

  <path d="M455 130 L485 130" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 5 -->
  <circle cx="520" cy="130" r="35" fill="#FCE4EC" stroke="#C62828" stroke-width="3"/>
  <text x="520" y="126" text-anchor="middle" font-size="18">🏗️</text>
  <text x="520" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#C62828">36–50</text>
  <text x="520" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">Projects</text>
  <text x="520" y="100" text-anchor="middle" font-size="10" fill="#666">Multi-agent</text>

  <path d="M520 165 L520 195" stroke="#C62828" stroke-width="2"/>
  <rect x="470" y="195" width="100" height="70" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="1.5"/>
  <text x="520" y="215" text-anchor="middle" font-size="10" fill="#C62828">▸ Supervisor/Worker</text>
  <text x="520" y="232" text-anchor="middle" font-size="10" fill="#C62828">▸ Agent swarms</text>
  <text x="520" y="249" text-anchor="middle" font-size="10" fill="#C62828">▸ Production API</text>

  <path d="M555 130 L585 130" stroke="#999" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Phase 6 -->
  <circle cx="620" cy="130" r="35" fill="#E3F2FD" stroke="#01579B" stroke-width="3"/>
  <text x="620" y="126" text-anchor="middle" font-size="18">🔬</text>
  <text x="620" y="145" text-anchor="middle" font-size="10" font-weight="bold" fill="#01579B">51–56</text>
  <text x="620" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#01579B">Advanced</text>
  <text x="620" y="100" text-anchor="middle" font-size="10" fill="#666">LCEL + RAG</text>

  <path d="M620 165 L620 195" stroke="#01579B" stroke-width="2"/>
  <rect x="570" y="195" width="100" height="70" rx="8" fill="#E3F2FD" stroke="#01579B" stroke-width="1.5"/>
  <text x="620" y="215" text-anchor="middle" font-size="10" fill="#01579B">▸ RunnableBranch</text>
  <text x="620" y="232" text-anchor="middle" font-size="10" fill="#01579B">▸ Fallbacks</text>
  <text x="620" y="249" text-anchor="middle" font-size="10" fill="#01579B">▸ Functional API</text>

  <!-- Bottom labels: Skill level -->
  <text x="220" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">🌱 Beginner</text>
  <text x="420" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#7B1FA2">🧠 Intermediate</text>
  <text x="620" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#C62828">🚀 Advanced</text>

  <!-- Bottom bars -->
  <rect x="100" y="330" width="180" height="12" rx="6" fill="#E3F2FD" stroke="#1565C0" stroke-width="1"/>
  <rect x="290" y="330" width="180" height="12" rx="6" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="1"/>
  <rect x="480" y="330" width="180" height="12" rx="6" fill="#FCE4EC" stroke="#C62828" stroke-width="1"/>
  <rect x="670" y="330" width="180" height="12" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1"/>

  <text x="140" y="358" text-anchor="middle" font-size="9" fill="#666">~3 hrs</text>
  <text x="380" y="358" text-anchor="middle" font-size="9" fill="#666">~4 hrs</text>
  <text x="570" y="358" text-anchor="middle" font-size="9" fill="#666">~6 hrs</text>
  <text x="760" y="358" text-anchor="middle" font-size="9" fill="#666">~2 hrs</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#999"/>
    </marker>
  </defs>
</svg>